[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transvid"
version = "0.1.0"
description = "Neural Latent Media Compression Machine for Extreme Video and Audio Compression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Transvid Contributors" }
]
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "encodec>=0.1.1",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "zstandard>=0.22.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
video = [
    "torchvision>=0.17.0",
    "opencv-python-headless>=4.9.0",
    "av>=12.0.0",
    "diffusers>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
transvid = "transvid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "transvid"]
